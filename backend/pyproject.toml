[project]
name = "seo-intelligence"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.160,<1",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.6",
  "sqlalchemy>=2.0.36,<2.1",
  "alembic>=1.14",
  "psycopg[binary]>=3.2",
  "httpx>=0.28,<0.29",
  "lxml>=5.3",
  "cryptography>=43",
  "redis>=5.2",
  "argon2-cffi>=23.1",
  "email-validator>=2.2",
  "snowballstemmer>=2.2",
  "regex>=2024.9",
  "cssselect>=1.2",
  "dnspython>=2.7",
  "openpyxl>=3.1",
  "minio>=7.2",
]

[project.scripts]
seo = "app.cli:main"

[dependency-groups]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "respx>=0.22", "hypothesis>=6.115"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
