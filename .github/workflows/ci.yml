name: ci
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env: {POSTGRES_USER: seo, POSTGRES_PASSWORD: seo, POSTGRES_DB: seo_intelligence_test}
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
      redis: {image: "redis:7", ports: ["6379:6379"]}
      clickhouse: {image: "clickhouse/clickhouse-server:latest", ports: ["8123:8123"]}
      minio:
        image: minio/minio:latest
        env: {MINIO_ROOT_USER: seo-minio, MINIO_ROOT_PASSWORD: seo-minio-dev-secret}
        ports: ["9000:9000"]
        options: server /data
    defaults: {run: {working-directory: backend}}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - run: uv run pytest -q
      - run: uvx bandit -q -r app -ll
      - run: uv export --no-dev --format requirements-txt --no-hashes > req.txt && uvx pip-audit -r req.txt
