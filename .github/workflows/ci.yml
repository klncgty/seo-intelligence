name: ci
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env: {POSTGRES_USER: seo, POSTGRES_PASSWORD: seo, POSTGRES_DB: seo_intelligence_test}
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
      redis: {image: "redis:7", ports: ["6379:6379"]}
      clickhouse:
        image: clickhouse/clickhouse-server:latest
        env:
          CLICKHOUSE_USER: default
          CLICKHOUSE_PASSWORD: ""
          CLICKHOUSE_ALWAYS_ALLOW_BLANK_PASSWORD: "1"
        ports: ["8123:8123"]
        options: --health-cmd "wget --no-verbose --tries=1 --spider http://127.0.0.1:8123/ping || exit 1" --health-interval 5s --health-retries 10
    defaults: {run: {working-directory: backend}}
    steps:
      - uses: actions/checkout@v4
      - name: Configure Postgres permissions for RLS
        run: |
          docker exec $(docker ps -q --filter ancestor=postgres:17) psql -U seo -d seo_intelligence_test -c "ALTER ROLE seo NOSUPERUSER NOBYPASSRLS;"
      - name: Setup Mock Claude CLI
        run: |
          sudo bash -c 'cat << "EOF" > /usr/local/bin/claude
          #!/bin/sh
          if [ "$1" = "--version" ]; then
            echo "Claude Code 1.0.0"
            exit 0
          fi
          echo "{\"status\": \"ok\", \"fix\": \"mock fix applied\"}"
          EOF'
          sudo chmod +x /usr/local/bin/claude
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - run: uv run pytest -q
      - run: uvx bandit -q -r app -ll
      - run: uv export --no-dev --format requirements-txt --no-hashes > req.txt && uvx pip-audit -r req.txt
